<!-- public/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Humanizer - Академический стиль</title>
    <style>
        /* Базовые цвета и настройки */
        :root {
            --primary: #4361ee;
            --primary-hover: #3a53d0;
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --border: #e2e8f0;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Главный контейнер (карточка) */
        .container {
            background-color: var(--surface);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h2 { margin-top: 0; font-size: 26px; }
        
        p { 
            color: var(--text-muted); 
            font-size: 15px; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }

        /* Поля ввода текста */
        textarea { 
            width: 100%; 
            box-sizing: border-box;
            padding: 16px; 
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
            background-color: var(--surface);
        }

        /* Кнопка */
        button { 
            background-color: var(--primary);
            color: white;
            border: none;
            margin: 20px 0; 
            padding: 14px 28px; 
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        /* Секция результата */
        .result-section {
            margin-top: 20px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        h3 { font-size: 18px; margin-top: 0; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Академический редактор текста</h2>
        <p>Вставьте сгенерированный материал ниже. Система адаптирует его под стандарты научно-исследовательских работ, убрав характерные ИИ-шаблоны и усилив научный стиль.</p>
        
        <textarea id="inputText" rows="8" placeholder="Вставьте исходный текст сюда..."></textarea>
        
        <button onclick="humanize()" id="submitBtn">Переписать текст</button>
        
        <div class="result-section">
            <h3>Результат:</h3>
            <textarea id="outputText" rows="10" readonly placeholder="Здесь появится готовый результат..."></textarea>
        </div>
    </div>

    <script>
        async function humanize() {
            const text = document.getElementById('inputText').value;
            const outputArea = document.getElementById('outputText');
            const btn = document.getElementById('submitBtn');
            
            if (!text.trim()) {
                outputArea.value = 'Пожалуйста, введите текст для обработки.';
                return;
            }

            // Визуальный отклик кнопки во время загрузки
            outputArea.value = 'Обработка данных... Пожалуйста, подождите.';
            btn.textContent = 'Обработка...';
            btn.style.opacity = '0.7';
            btn.disabled = true;
            
            try {
                // ССЫЛКА ОБНОВЛЕНА НА ВАШ СЕРВЕР RENDER
                const response = await fetch('https://ai-humanizer-ftuq.onrender.com/api/humanize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    outputArea.value = 'Ошибка: ' + data.error;
                } else {
                    outputArea.value = data.result;
                }
            } catch (err) {
                outputArea.value = 'Ошибка соединения с сервером.';
            } finally {
                // Возвращаем кнопку в исходное состояние
                btn.textContent = 'Переписать текст';
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
